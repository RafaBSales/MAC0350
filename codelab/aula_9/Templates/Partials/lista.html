<div>
    <input type="text" 
        name="busca" 
        placeholder="Buscar..."
        hx-get="/lista"
        hx-trigger="input changed delay:500ms"
        hx-select="#lista"
        hx-target="#lista"
        hx-indicator="#indicator">

    <img id="indicator" class="htmx-indicator" src="/Static/spinner.svg" alt="Carregando..."/>
</div>
<div id="lista">
    <ul>
        {% for aluno in alunos %}
            <li>{{ aluno.id }} {{ aluno.nome }}</li>
        {% else %}
            <li>Não há alunos</li>
        {% endfor %}
    </ul>
    <input type="hidden" name="page" value="{{ page }}" id="page">
    <button hx-get="/lista"
            hx-include="[name='page'], [name='busca']"
            hx-vals='js:{page: parseInt(document.getElementById("page").value) - 1}'
            hx-target="#lista"
            hx-select="#lista">
        Anterior
    </button>
    <button hx-get="/lista"
            hx-include="[name='page'], [name='busca']"
            hx-vals='js:{page: parseInt(document.getElementById("page").value) + 1}'
            hx-target="#lista"
            hx-select="#lista">
        Próximo
    </button>
</div>
